spring.application.name=Payments

server.port=8081
# Postgres connection
spring.datasource.url=jdbc:postgresql://localhost:5432/payments
spring.datasource.username=payments
spring.datasource.password=payments
spring.datasource.driver-class-name=org.postgresql.Driver

# Desabilita Flyway (usando ddl-auto por enquanto)
spring.flyway.enabled=false

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Kafka
spring.kafka.bootstrap-servers=localhost:29092
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer

# Kafka Consumer
spring.kafka.consumer.group-id=payment-processor
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=com.payment.system.domain.events

authorizer.url=http://localhost:8082

resilience4j.circuitbreaker.instances.authorizer.sliding-window-size=10
resilience4j.circuitbreaker.instances.authorizer.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.authorizer.wait-duration-in-open-state=10s
resilience4j.circuitbreaker.instances.authorizer.permitted-number-of-calls-in-half-open-state=3